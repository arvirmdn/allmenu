<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- Mencegah zoom di perangkat seluler -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>arvirmdn - Vintage Hub</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style_1787688728027.css?v=4.0">
</head>
<body>

  <!-- Audio Background -->
  <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="ios-app">
    <!-- Header Topbar iOS -->
    <header class="ios-header">
      <div class="header-brand">
        <span class="app-title">arvirmdn</span>
        <i class="fa-solid fa-circle-check verified-badge" title="Verified"></i>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="ios-btn-icon" title="Ganti Mode">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </header>

    <!-- Konten Tab HOME -->
    <main id="tab-home" class="tab-content active">
      <!-- Profile Card iOS -->
      <section class="ios-card profile-card">
        <div class="avatar-wrapper">
          <img src="https://ui-avatars.com/api/?name=arvirmdn&background=007AFF&color=fff&size=128" alt="Profile" class="avatar">
          <button id="music-btn" class="ios-music-badge">
            <i class="fa-solid fa-music"></i>
          </button>
        </div>
        <div class="profile-name-container">
          <h1 class="profile-name">arvirmdn</h1>
          <i class="fa-solid fa-circle-check verified-badge" title="Verified"></i>
        </div>
        <p class="profile-bio">Digital Creator & Developer</p>
      </section>

      <!-- Menu Shortcuts -->
      <section class="ios-section">
        <h2 class="section-label">Navigasi Utama</h2>
        
        <!-- Menu Donate Barunya -->
        <a href="#" class="ios-list-item" onclick="alert('Terima kasih dukungannya! Rekening / QRIS dapat disesuaikan di file index.html'); return false;">
          <div class="item-icon icon-amber"><i class="fa-solid fa-heart"></i></div>
          <div class="item-text">
            <span class="item-title">Donate</span>
            <span class="item-sub">donate arvirmdn agar web lebih berkembang</span>
          </div>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>

        <a href="https://t.me/" target="_blank" class="ios-list-item">
          <div class="item-icon icon-pink"><i class="fa-solid fa-paper-plane"></i></div>
          <div class="item-text">
            <span class="item-title">Hubungi Saya</span>
            <span class="item-sub">Telegram & Whatsapp Official</span>
          </div>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
      </section>
    </main>

    <!-- Konten Tab TOOLS -->
    <main id="tab-tools" class="tab-content">
      <section class="ios-section">
        <h2 class="section-label">Media Downloader</h2>
        
        <div class="ios-card downloader-card">
          <div class="card-title-row">
            <div class="item-icon icon-red"><i class="fa-brands fa-tiktok"></i></div>
            <div>
              <span class="item-title">TikTok Downloader</span>
              <span class="item-sub">Unduh Video HD & Audio MP3</span>
            </div>
          </div>

          <div class="ios-input-group">
            <input type="url" id="tiktok-url" placeholder="Tempel link video TikTok di sini..." autocomplete="off">
            <button id="download-btn" class="ios-btn-primary">
              <i class="fa-solid fa-arrow-down"></i>
            </button>
          </div>

          <div id="result-box" class="result-box" style="display: none;"></div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar iOS -->
    <nav class="ios-tab-bar">
      <button class="tab-btn active" data-tab="tab-home">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </button>
      <button class="tab-btn" data-tab="tab-tools">
        <i class="fa-solid fa-screwdrivers-toolkit"></i>
        <span>Tools</span>
      </button>
    </nav>
  </div>

  <script src="script_1787688728061.js?v=4.0"></script>
</body>
</html>
