<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>arvirmdn - Vintage Hub</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body>

  <!-- Audio Background -->
  <audio id="bg-music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="ios-app">
    <!-- Header Topbar iOS -->
    <header class="ios-header">
      <div class="header-brand">
        <span class="app-title">arvirmdn</span>
        <i class="fa-solid fa-circle-check verified-badge" title="Verified"></i>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="ios-btn-icon" title="Ganti Mode">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </header>

    <!-- Konten Tab HOME -->
    <main id="tab-home" class="tab-content active">
      <!-- Profile Card iOS -->
      <section class="ios-card profile-card">
        <div class="avatar-wrapper">
           <img src="https://ui-avatars.com/api/?name=arvirmdn&background=8A5D3B&color=F4E5C3&size=128" alt="Profile" class="avatar">
          <button id="music-btn" class="ios-music-badge">
            <i class="fa-solid fa-music"></i>
          </button>
        </div>
        <div class="profile-name-container">
          <h1 class="profile-name">arvirmdn</h1>
          <i class="fa-solid fa-circle-check verified-badge" title="Verified"></i>
        </div>
        <p class="profile-bio">Digital Creator & Developer</p>
      </section>

      <!-- Menu Shortcuts -->
      <section class="ios-section">
        <h2 class="section-label">Navigasi Utama</h2>
        
        <!-- Menu Donate (Link Diperbarui) -->
        <a href="https://arvirmdn.github.io/donate/" target="_blank" class="ios-list-item">
          <div class="item-icon icon-amber"><i class="fa-solid fa-heart"></i></div>
          <div class="item-text">
            <span class="item-title">Donate</span>
            <span class="item-sub">donate arvirmdn agar web lebih berkembang</span>
          </div>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>

        <!-- Hubungi Saya (WhatsApp dengan pesan otomatis) -->
        <a href="https://wa.me/6283117949780?text=HALO%20MASEH%20!" target="_blank" class="ios-list-item">
          <div class="item-icon icon-pink"><i class="fa-brands fa-whatsapp"></i></div>
          <div class="item-text">
            <span class="item-title">Hubungi Saya</span>
            <span class="item-sub">WhatsApp: 083117949780</span>
          </div>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>

        <!-- Join Group & Saluran (Ganti # dengan link asli kamu) -->
        <a href="https://chat.whatsapp.com/DvBYvvQaob3BaqW0icEWaS?s=cl&p=a&ilr=4" target="_blank" class="ios-list-item">
          <div class="item-icon icon-blue"><i class="fa-solid fa-users"></i></div>
          <div class="item-text">
            <span class="item-title">Join Group</span>
            <span class="item-sub">Gabung komunitas kami</span>
          </div>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>

        <a href="https://t.me/username_channel_kamu" target="_blank" class="ios-list-item">
          <div class="item-icon icon-green"><i class="fa-solid fa-bullhorn"></i></div>
          <div class="item-text">
            <span class="item-title">Join Saluran</span>
            <span class="item-sub">Ikuti update terbaru</span>
          </div>
          <i class="fa-solid fa-chevron-right item-arrow"></i>
        </a>
      </section>
    </main>

    <!-- Konten Tab TOOLS -->
    <main id="tab-tools" class="tab-content">
      <section class="ios-section">
        <h2 class="section-label">Media Downloader</h2>
        
        <div class="ios-card downloader-card">
          
          <!-- Pilihan Platform -->
          <div class="platform-selector">
            <button class="platform-btn active" data-platform="tiktok"><i class="fa-brands fa-tiktok"></i> TikTok</button>
            <button class="platform-btn" data-platform="youtube"><i class="fa-brands fa-youtube"></i> YouTube</button>
            <button class="platform-btn" data-platform="instagram"><i class="fa-brands fa-instagram"></i> Insta</button>
            <button class="platform-btn" data-platform="facebook"><i class="fa-brands fa-facebook"></i> FB</button>
          </div>

          <div class="ios-input-group">
            <input type="url" id="media-url" placeholder="Tempel link video di sini..." autocomplete="off">
            <button id="download-btn" class="ios-btn-primary">
              <i class="fa-solid fa-arrow-down"></i>
            </button>
          </div>

          <div id="result-box" class="result-box" style="display: none;"></div>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Bar iOS -->
    <nav class="ios-tab-bar">
      <button class="tab-btn active" data-tab="tab-home">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </button>
      <button class="tab-btn" data-tab="tab-tools">
        <i class="fa-solid fa-toolbox" aria-hidden="true"></i>
        <span>Tools</span>
      </button>
    </nav>
  </div>

  <script src="script.js?v=5.0"></script>
</body>
</html>
